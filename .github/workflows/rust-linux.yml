name: Rust Linux Verification

on:
  push:
    paths:
      - "linux/**"
      - "spec/**"
      - "tools/generate_fpga_abi.py"
      - ".github/workflows/rust-linux.yml"
  pull_request:
    paths:
      - "linux/**"
      - "spec/**"
      - "tools/generate_fpga_abi.py"
      - ".github/workflows/rust-linux.yml"
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - name: Check generated ABI files
        run: python tools/generate_fpga_abi.py --check
      - name: Formatting
        run: cargo fmt --manifest-path linux/rust/Cargo.toml --all -- --check
      - name: Clippy with warnings denied
        run: cargo clippy --manifest-path linux/rust/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --manifest-path linux/rust/Cargo.toml
