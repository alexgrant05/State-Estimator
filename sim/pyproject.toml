[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cornell-rocketry-digital-twin"
version = "0.2.0"
description = "Timestamped multi-sensor digital-twin reference for the Cornell Rocketry state estimator"
requires-python = ">=3.10,<3.14"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "rocketpy==1.12.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
digital-twin = "digital_twin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
